name: Tests and reproducible examples
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 audit.py --identity examples/identity.json --profiles examples/profiles.csv --output-dir reports --as-of 2026-11-01
      - run: diff -r examples/output reports
      - run: python3 audit.py --identity examples/organization-identity.json --profiles examples/organization-profiles.csv --output-dir reports/organization --as-of 2026-11-01
      - run: python3 tools/verify_connected_example.py
